[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-visual-bridge"
version = "0.1.0"
description = "Universal, local-first, zero-dependency visual arbitration bridge between AI coding agents and human developers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "raillersing" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "ai-agent",
    "human-in-the-loop",
    "hitl",
    "code-review",
    "audit",
    "visual-bridge",
    "mcp",
    "claude-code",
    "cursor",
    "antigravity",
    "codex"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
agent-bridge = "agent_visual_bridge.cli:main"
avb = "agent_visual_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/raillersing/agent-visual-bridge"
Repository = "https://github.com/raillersing/agent-visual-bridge.git"
Issues = "https://github.com/raillersing/agent-visual-bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
